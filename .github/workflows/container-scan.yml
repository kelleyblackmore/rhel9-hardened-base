name: Container Security Scan

on:
  push:
    branches:
      - '**'  # Run on all branches
  pull_request:
    branches:
      - '**'  # Run on PRs to any branch
  schedule:
    - cron: '0 6 * * *'   # daily -- catch upstream fixes as soon as they land
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Gate/report on CVEs that actually have a fix. Unfixable ones (no upstream
  # patch -- "impossible to update to the latest") are inventoried separately as
  # accepted risk, not counted against the image.
  TRIVY_IGNORE_UNFIXED: 'true'

jobs:
  secret-scan:
    name: Secret Scanning with GitLeaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for secret scanning

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE}} # Optional: for GitLeaks Pro features

      - name: Upload GitLeaks results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gitleaks-report
          path: results.sarif
          retention-days: 30

  build-and-scan-report:
    name: Build and Scan Container (Report Only)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    permissions:
      contents: read
      packages: write
      security-events: write  # For uploading SARIF results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          load: true  # Load image locally for scanning
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy for JSON report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
          format: 'json'
          output: 'trivy-results.json'

      - name: Run Trivy for table format (human readable)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
          format: 'table'
          output: 'trivy-results.txt'

      # Full inventory INCLUDING unfixed CVEs (override the workflow-level ignore).
      - name: Inventory all CVEs (incl. unfixed / accepted)
        env:
          TRIVY_IGNORE_UNFIXED: 'false'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
          format: 'json'
          output: 'trivy-all.json'

      - name: FIXABLE gate + accepted-CVE summary
        run: |
          # trivy-results.json = FIXABLE only (TRIVY_IGNORE_UNFIXED=true).
          # trivy-all.json     = everything (fixable + unfixed/accepted).
          fx() { jq --arg s "$1" '[.Results[]?.Vulnerabilities[]? | select(.Severity==$s)] | length' trivy-results.json; }
          al() { jq --arg s "$1" '[.Results[]?.Vulnerabilities[]? | select(.Severity==$s)] | length' trivy-all.json; }
          FC=$(fx CRITICAL); FH=$(fx HIGH); FM=$(fx MEDIUM); FL=$(fx LOW)
          AC=$(al CRITICAL); AH=$(al HIGH); AM=$(al MEDIUM); AL=$(al LOW)
          {
            echo "## Container CVEs (Trivy)"
            echo "| Severity | Fixable (must be 0) | Accepted (no upstream fix) |"
            echo "|----------|--------------------:|---------------------------:|"
            echo "| CRITICAL | $FC | $((AC-FC)) |"
            echo "| HIGH     | $FH | $((AH-FH)) |"
            echo "| MEDIUM   | $FM | $((AM-FM)) |"
            echo "| LOW      | $FL | $((AL-FL)) |"
            echo
            echo "Fixable CVEs are gated to 0 (image is updated to the latest available)."
            echo "Accepted CVEs have **no upstream fix** and are tracked; the daily scan"
            echo "surfaces them the moment a fix is published."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Fixable -> CRITICAL:$FC HIGH:$FH MEDIUM:$FM LOW:$FL"
          echo "Accepted(unfixed) -> CRITICAL:$((AC-FC)) HIGH:$((AH-FH)) MEDIUM:$((AM-FM)) LOW:$((AL-FL))"
          # Gate: fail if any FIXABLE CRITICAL/HIGH remains (i.e. we did not update).
          if [ "$FC" -gt 0 ] || [ "$FH" -gt 0 ]; then
            echo "::error::$FC fixable CRITICAL and $FH fixable HIGH CVEs — update the base to remediate."
            exit 1
          fi
          echo "No fixable CRITICAL/HIGH CVEs."

      - name: Upload Trivy scan reports
        uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: trivy-scan-results-report
          path: |
            trivy-results.sarif
            trivy-results.json
            trivy-results.txt
            trivy-all.json
          retention-days: 30

  build-and-scan-enforce:
    name: Build and Scan Container (Enforce on PR to Main)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      contents: read
      packages: write
      security-events: write  # For uploading SARIF results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          load: true  # Load image locally for scanning
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy for JSON report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
          format: 'json'
          output: 'trivy-results.json'

      - name: Run Trivy for table format (human readable)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
          format: 'table'
          output: 'trivy-results.txt'

      - name: Check for HIGH and CRITICAL vulnerabilities (blocking)
        run: |
          # Count HIGH and CRITICAL vulnerabilities
          HIGH_VULNS=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json)
          CRITICAL_VULNS=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json)
          
          echo "Vulnerability Summary (Enforcement Mode):"
          echo "Critical: $CRITICAL_VULNS"
          echo "High: $HIGH_VULNS"
          
          # Set outputs for other jobs
          echo "critical_vulns=$CRITICAL_VULNS" >> $GITHUB_OUTPUT
          echo "high_vulns=$HIGH_VULNS" >> $GITHUB_OUTPUT
          
          # Display summary in table format
          echo "Detailed Results:"
          cat trivy-results.txt
          
          # Fail the job if there are CRITICAL vulnerabilities
          if [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "Build failed: $CRITICAL_VULNS CRITICAL vulnerabilities found!"
            echo "Please review and fix critical vulnerabilities before proceeding."
            exit 1
          elif [ "$HIGH_VULNS" -gt 0 ]; then
            echo "Warning: $HIGH_VULNS HIGH severity vulnerabilities found!"
            echo "Consider addressing these vulnerabilities."
          else
            echo "No critical or high severity vulnerabilities found!"
          fi

      - name: Upload Trivy scan reports
        uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: trivy-scan-results-enforce
          path: |
            trivy-results.sarif
            trivy-results.json
            trivy-results.txt
          retention-days: 30

  filesystem-scan:
    name: Filesystem Scan with Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'

      - name: Upload filesystem scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: 'trivy-fs-results.sarif'

      - name: Run Trivy filesystem scan (table format)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-fs-results.txt'

      - name: Upload filesystem scan reports
        uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: trivy-filesystem-results
          path: |
            trivy-fs-results.sarif
            trivy-fs-results.txt
          retention-days: 30
